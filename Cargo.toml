[package]
name = "supersimple"
version = "0.1.0"
edition = "2021"
description = "Super Simple - a terminal task manager you type into like a text editor"
license = "MIT"
repository = "https://github.com/Daniel-VaR/SuperSimple"

[[bin]]
name = "supersimple"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
strip = true
